distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址会 307 跳到 release-assets.githubusercontent.com，Java 的 cacerts 可能不信任该域名，
# 导致 "PKIX path building failed"。国内环境优先用镜像。
# 官方（若网络可达可改回）：https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.10.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
