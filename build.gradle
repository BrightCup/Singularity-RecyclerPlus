plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArguments.addAll '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    // JEI
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    // 编译期依赖原 mod。仅需编译，不需要打包进本模组。
    compileOnly files('libs/mio_icif.jar')
    // 仅用于 runClient / runServer 的本地联调，不会被打进产物。
    runtimeOnly files('libs/mio_icif.jar')

    // JEI 只用于构建期编译与本地联调；运行时由整合包提供，不打进产物。
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 把 gradle.properties 中的版本信息注入 mods.toml
processResources {
    var replaceProperties = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}
