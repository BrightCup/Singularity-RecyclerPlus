# 原 mod（Singularity Iteration）的 jar，构建前放到 libs/mio_icif.jar
# 在原仓库执行 ./gradlew build 后，从 build/libs/ 取产物并改名

# 本机 JAVA_HOME 指向 Minecraft 自带的 Java 17，Gradle 默认探测不到 JDK 21，
# 这里显式告知 toolchain 位置。换机器构建时改成自己的 JDK 21 路径（逗号分隔多个）。
org.gradle.java.installations.paths=C:/Program Files/Java/Java-jdk-21.0.6+8.1
